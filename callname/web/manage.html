<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>名单管理</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="manage.css" />
</head>
<body class="manage-page">
  <div class="board-backdrop"></div>

  <!-- 锁屏：未解锁前 .sheet 保持 hidden，避免名单在背后闪现 -->
  <div id="lock" class="modal lock-layer">
    <form id="lock-form" class="modal-card lock-card" autocomplete="off">
      <h2 id="lock-title">输入管理员密码</h2>
      <p id="lock-hint" class="lock-hint">名单管理需要管理员密码</p>

      <label class="lock-field">
        密码
        <input id="lock-password" class="input" type="password" autocomplete="current-password" />
      </label>
      <label id="lock-confirm-field" class="lock-field" hidden>
        再输一遍
        <input id="lock-confirm" class="input" type="password" autocomplete="new-password" />
      </label>

      <p id="lock-error" class="lock-error" role="alert" hidden></p>

      <footer class="modal-actions">
        <button id="lock-submit" class="btn btn-small btn-primary" type="submit">解锁</button>
      </footer>
    </form>
  </div>

  <div class="sheet" hidden>
    <header class="sheet-head">
      <div class="title-block">
        <h1>名单管理</h1>
        <p class="subtitle">权重只影响先被点到的概率</p>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">总人数</span>
          <span id="stat-total" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">启用</span>
          <span id="stat-active" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">累计抽中</span>
          <span id="stat-draws" class="stat-value stat-gold">0</span>
        </div>
      </div>

      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.6-3.6" />
        </svg>
        <input id="search" type="search" placeholder="搜索姓名…" autocomplete="off" />
      </label>
    </header>

    <section class="toolbar">
      <div class="add-group">
        <input id="new-name" class="input" type="text" placeholder="姓名" autocomplete="off" />
        <label class="weight-field">
          权重
          <input id="new-weight" class="input input-weight" type="number" min="1" max="99" step="1" value="1" />
        </label>
        <button id="add" class="btn btn-small btn-primary" type="button">添加</button>
      </div>

      <span class="spacer"></span>

      <button id="import" class="btn btn-small btn-ghost" type="button">导入文件…</button>
      <button id="delete-selected" class="btn btn-small btn-danger" type="button">删除所选</button>
      <button id="clear-counts" class="btn btn-small btn-ghost" type="button">重置累计次数</button>
      <button id="change-password" class="btn btn-small btn-ghost" type="button">修改密码</button>
    </section>

    <p class="hint">权重只影响谁更可能先被点到；每人每轮仍恰好被点一次。</p>

    <div class="table-wrap">
      <table class="roster">
        <thead>
          <tr>
            <th class="col-check"><input id="check-all" type="checkbox" aria-label="全选" /></th>
            <th class="col-name">姓名</th>
            <th class="col-weight">权重</th>
            <th class="col-count">累计抽中</th>
            <th class="col-when">最后抽中</th>
            <th class="col-active">状态</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>名单还是空的，先添加或导入一份名单。</p>
    </div>
  </div>

  <p id="toast" class="toast manage-toast" role="status" aria-live="polite"></p>

  <!-- 导入预览弹层 -->
  <div id="import-modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="import-title">导入预览</h2>
      <div class="modal-body">
        <dl id="import-facts" class="facts"></dl>

        <fieldset class="choice-group">
          <legend>重复姓名</legend>
          <label class="choice">
            <input type="radio" name="dedupe" value="skip" checked />
            <span>跳过已存在</span>
          </label>
          <label class="choice">
            <input type="radio" name="dedupe" value="overwrite" />
            <span>覆盖权重</span>
          </label>
        </fieldset>

        <fieldset class="choice-group">
          <legend>导入方式</legend>
          <label class="choice">
            <input type="radio" name="mode" value="merge" checked />
            <span>追加到现有名单</span>
          </label>
          <label class="choice">
            <input type="radio" name="mode" value="replace" />
            <span>替换全部名单</span>
          </label>
        </fieldset>

        <label class="weight-field">
          默认权重
          <input id="import-weight" class="input input-weight" type="number" min="1" max="99" step="1" value="1" />
        </label>
        <p class="hint">没写权重的条目使用这里的默认权重。txt 可用空格、制表符、中英文逗号、顿号或换行分隔姓名。</p>
        <p id="import-warning" class="warn" hidden></p>
      </div>
      <footer class="modal-actions">
        <button id="import-cancel" class="btn btn-small btn-ghost" type="button">取消</button>
        <button id="import-confirm" class="btn btn-small btn-primary" type="button">确认导入</button>
      </footer>
    </div>
  </div>

  <!-- 修改密码弹层 -->
  <div id="password-modal" class="modal" hidden>
    <form id="password-form" class="modal-card" autocomplete="off">
      <h2>修改管理员密码</h2>
      <div class="modal-body">
        <label class="lock-field">
          原密码
          <input id="old-password" class="input" type="password" autocomplete="current-password" />
        </label>
        <label class="lock-field">
          新密码
          <input id="new-password" class="input" type="password" autocomplete="new-password" />
        </label>
        <label class="lock-field">
          再输一遍新密码
          <input id="new-password-confirm" class="input" type="password" autocomplete="new-password" />
        </label>
        <p class="hint">密码至少 4 位，请妥善保管；程序不提供重置入口。</p>
        <p id="password-error" class="lock-error" role="alert" hidden></p>
      </div>
      <footer class="modal-actions">
        <button id="password-cancel" class="btn btn-small btn-ghost" type="button">取消</button>
        <button class="btn btn-small btn-primary" type="submit">保存</button>
      </footer>
    </form>
  </div>

  <!-- 通用确认弹层（嵌入式 WebView 的 confirm() 不可靠） -->
  <div id="confirm-modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="confirm-title">确认</h2>
      <div class="modal-body">
        <p id="confirm-text" class="confirm-text"></p>
      </div>
      <footer class="modal-actions">
        <button id="confirm-cancel" class="btn btn-small btn-ghost" type="button">取消</button>
        <button id="confirm-ok" class="btn btn-small btn-danger" type="button">确定</button>
      </footer>
    </div>
  </div>

  <script type="module" src="manage.js"></script>
</body>
</html>
